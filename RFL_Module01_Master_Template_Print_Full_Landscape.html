<!DOCTYPE html>
<html lang="en">
<head>

<title>RFL A0-A2 · Module 01 · Master Template Integrated</title>
<style>
:root{
  --navy:#061a40;--navy-2:#0b2d72;--red:#ef3340;--ink:#07142f;--muted:#667085;--line:#dbe3ef;--soft:#f7f9fc;--white:#ffffff;--shadow:0 24px 80px rgba(6,26,64,.16);--shadow-soft:0 14px 38px rgba(6,26,64,.10);--radius:26px;--slide-w:1280px;--slide-h:720px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 20%,rgba(239,51,64,.08),transparent 32%),radial-gradient(circle at 80% 15%,rgba(11,45,114,.12),transparent 36%),linear-gradient(180deg,#ffffff 0%,#eef3fb 100%);color:var(--ink);overflow:hidden}
button,select{font:inherit}button{cursor:pointer}
.deck-shell{height:100vh;display:grid;place-items:center;padding:70px 22px 78px;position:relative}
.topbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.86);border:1px solid var(--line);box-shadow:var(--shadow-soft);backdrop-filter:blur(14px);border-radius:999px;padding:10px 14px;max-width:calc(100vw - 24px)}
.topbar label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:1000;color:var(--navy);white-space:nowrap}
.lesson-select{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:10px 14px;font-weight:850;min-width:360px;max-width:54vw}
.tool-btn{border:none;background:var(--navy);color:#fff;border-radius:999px;padding:10px 15px;font-size:12px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase}
.tool-btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}
.deck{width:min(var(--slide-w),calc(100vw - 44px));aspect-ratio:16/9;position:relative;background:#fff;border:1px solid rgba(219,227,239,.95);border-radius:30px;overflow:hidden;box-shadow:var(--shadow)}
.slide{position:absolute;inset:0;padding:42px 52px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(248,251,255,.94)),#fff;opacity:0;transform:translateX(36px) scale(.985);pointer-events:none;transition:opacity .42s cubic-bezier(.2,.8,.2,1),transform .42s cubic-bezier(.2,.8,.2,1),filter .42s cubic-bezier(.2,.8,.2,1);filter:blur(3px)}
.slide.active{opacity:1;transform:translateX(0) scale(1);pointer-events:auto;filter:blur(0);z-index:2}
.slide-bg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.slide-bg img{width:100%;height:100%;object-fit:cover;object-position:center right;opacity:.92}
.slide-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,1) 0%,rgba(255,255,255,.94) 38%,rgba(255,255,255,.60) 58%,rgba(255,255,255,.12) 76%),linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.55))}
.slide > *:not(.slide-bg):not(.american-line){position:relative;z-index:1}
.american-line{position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,var(--navy) 0 70%,var(--red) 70% 100%);z-index:5}
.slide-top{display:flex;justify-content:space-between;align-items:center;gap:24px}
.brand-lockup{display:flex;align-items:center;gap:14px;color:var(--navy)}
.wordmark{font-size:30px;font-weight:1000;letter-spacing:-.03em}
.brand-meta{font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#475467;line-height:1.25}
.slide-counter{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:999px;box-shadow:var(--shadow-soft)}
.slide-main{display:grid;align-content:center;gap:16px;padding:10px 0;min-height:0;overflow:hidden}
.kicker{color:var(--red);font-size:13px;font-weight:1000;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:14px}.kicker:after{content:"";width:48px;height:2px;background:var(--red);border-radius:999px}
h1,h2{font-family:Georgia,"Times New Roman",serif;color:var(--navy);letter-spacing:-.055em;line-height:.96}
h1{font-size:clamp(44px,5.8vw,72px);max-width:760px}h2{font-size:clamp(34px,4.5vw,54px);max-width:900px}
.subtitle{color:#344054;font-size:18px;line-height:1.38;max-width:800px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.mission-card,.prompt-card,.vocab-card,.culture-note,.badge-card,.mini-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow-soft)}
.mission-card{background:linear-gradient(145deg,var(--navy),#071f52);color:#fff;border-radius:24px;padding:22px;box-shadow:var(--shadow);min-height:178px;display:grid;align-content:center;gap:10px;overflow:hidden;position:relative}
.mission-card:before{content:"RFL";position:absolute;right:-18px;bottom:-38px;color:rgba(255,255,255,.06);font-size:150px;font-weight:1000;letter-spacing:-.08em}
.mission-card small{color:#c7d2fe;font-weight:900;letter-spacing:.16em;text-transform:uppercase;position:relative;z-index:1}
.mission-card strong{font-family:Georgia,"Times New Roman",serif;font-size:32px;line-height:1;letter-spacing:-.045em;position:relative;z-index:1}
.mission-card p{color:#e6edf7;font-size:15px;line-height:1.35;position:relative;z-index:1}
.vocab-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.vocab-card{min-height:98px;display:grid;gap:6px;align-content:center}
.vocab-card strong{color:var(--navy);font-size:21px;line-height:1.05;letter-spacing:-.035em}
.vocab-card span{color:#475467;font-size:13px;line-height:1.28}
.vocab-card em{color:#18243d;font-style:normal;border-left:3px solid var(--red);padding-left:9px;font-size:13px;line-height:1.25}
.dialogue-box{background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow-soft)}
.dialogue-line{display:grid;grid-template-columns:42px 82px 1fr 34px;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid #edf1f7;transition:.2s ease}
.dialogue-line:last-child{border-bottom:none}.dialogue-line.active{background:#f8fbff;box-shadow:inset 5px 0 0 var(--red)}
.dialogue-text{font-size:15px;color:#18243d;line-height:1.2}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:1000;font-size:18px}
.avatar.rachel{background:var(--red)}.avatar.staff{background:#475467}
.speaker{color:var(--navy);font-size:13px;font-weight:1000;text-transform:uppercase;letter-spacing:.08em}.speaker.rachel{color:var(--red)}
.play,.control-btn{border-radius:50%;border:none;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px rgba(6,26,64,.2);font-weight:900}
.play{width:34px;height:34px}.big-play{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:max-content;border:none;background:var(--navy);color:#fff;border-radius:999px;padding:12px 18px;font-weight:1000;box-shadow:0 12px 28px rgba(6,26,64,.18)}
.grammar-focus{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:stretch}
.grammar-panel{background:linear-gradient(145deg,var(--navy),#071f52);color:#fff;border-radius:24px;padding:20px;box-shadow:var(--shadow);display:grid;align-content:center;gap:10px}
.grammar-panel small{color:#c7d2fe;font-size:12px;font-weight:1000;letter-spacing:.16em;text-transform:uppercase}
.grammar-panel strong{font-family:Georgia,"Times New Roman",serif;font-size:27px;line-height:1;letter-spacing:-.05em}
.grammar-panel p{font-size:14px;line-height:1.32;color:#e6edf7}
.examples{display:grid;gap:8px}
.example{background:#fff;border:1px solid var(--line);border-left:5px solid var(--red);border-radius:0 16px 16px 0;padding:10px 14px;box-shadow:var(--shadow-soft);font-size:16px;line-height:1.2;color:#18243d;overflow-wrap:anywhere}
.mission-list{display:grid;gap:10px}
.mission-item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 18px;box-shadow:var(--shadow-soft);display:grid;grid-template-columns:30px 1fr 34px;gap:12px;align-items:center;font-size:17px;line-height:1.2;color:#18243d;font-weight:750}
.mission-item:before{content:"✓";width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:1000;font-size:16px}
.word-bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:2px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;box-shadow:var(--shadow-soft);font-size:15px;font-weight:850;color:var(--navy)}
.slide-footer{display:flex;justify-content:space-between;align-items:center;color:#667085;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.progress-track{width:190px;height:6px;background:#e6ebf3;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--navy),var(--red));border-radius:999px;transition:width .42s ease}
.controls{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px;border:1px solid rgba(219,227,239,.85);background:rgba(255,255,255,.78);backdrop-filter:blur(14px);border-radius:999px;box-shadow:0 18px 45px rgba(6,26,64,.14);z-index:30}
.control-btn{width:44px;height:44px;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:18px}
.control-btn.primary{width:auto;padding:0 18px;border-radius:999px;background:var(--navy);color:#fff;border-color:var(--navy);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.hint{position:fixed;right:24px;bottom:30px;color:#667085;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;z-index:25}
.status{position:fixed;left:24px;bottom:30px;color:#667085;font-size:12px;font-weight:800;z-index:25;max-width:420px}
@media(max-width:900px){
 body{overflow:auto}.topbar{top:8px;border-radius:18px;align-items:stretch;flex-direction:column;width:calc(100vw - 24px)}.lesson-select{min-width:0;max-width:100%;width:100%}.deck-shell{height:auto;min-height:100vh;padding:172px 0 92px}.deck{width:100%;height:auto;aspect-ratio:auto;border-radius:0;box-shadow:none;border:none;overflow:visible}.slide{position:relative;display:none;min-height:100vh;padding:34px 24px}.slide.active{display:grid}.two-col,.grammar-focus{grid-template-columns:1fr}.vocab-grid{grid-template-columns:1fr}.dialogue-line{grid-template-columns:52px 80px 1fr}.dialogue-line .play{grid-column:2 / -1;width:100%;border-radius:12px}.controls{bottom:12px}.hint,.status{display:none}
}
@media print{
 *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
 @page{size:13.333in 7.5in;margin:0}
 html,body{width:13.333in !important;height:7.5in !important;background:#fff !important;overflow:visible !important;margin:0 !important;padding:0 !important}
 .topbar,.controls,.hint,.status,.play,.big-play,audio{display:none !important}
 .deck-shell{display:block !important;width:13.333in !important;height:auto !important;padding:0 !important;margin:0 !important;overflow:visible !important}
 .deck{display:block !important;width:13.333in !important;height:auto !important;aspect-ratio:auto !important;border:none !important;box-shadow:none !important;border-radius:0 !important;overflow:visible !important;background:#fff !important}
 .slide{position:relative !important;inset:auto !important;display:grid !important;grid-template-rows:auto minmax(0,1fr) auto !important;opacity:1 !important;transform:none !important;filter:none !important;pointer-events:auto !important;page-break-after:always !important;break-after:page !important;page-break-inside:avoid !important;break-inside:avoid !important;width:13.333in !important;height:7.5in !important;min-height:7.5in !important;padding:0.42in 0.5in !important;border:none !important;border-radius:0 !important;box-shadow:none !important;overflow:hidden !important}
 .slide:last-child{page-break-after:auto !important;break-after:auto !important}
 .slide-main{overflow:hidden !important;align-content:center !important;padding:0.12in 0 !important}
 .slide-bg img{width:100% !important;height:100% !important;object-fit:cover !important}
 .american-line{height:0.07in !important}
 .slide-counter{box-shadow:none !important}
 .vocab-card,.prompt-card,.mission-card,.dialogue-box,.grammar-panel,.example,.culture-note,.badge-card,.mission-item{box-shadow:none !important}
}
</style>

<body>
<div class="topbar">
  <label for="lessonSelect">Select lesson</label>
  <select id="lessonSelect" class="lesson-select"></select>
  <button class="tool-btn secondary" onclick="toggleAmbient()">Ambient</button>
  <button class="tool-btn secondary" onclick="stopAudio()">Stop</button>
  <button class="tool-btn secondary" onclick="downloadHTML()">Download</button>
</div>

<div class="deck-shell"><main class="deck" id="deck"></main></div>

<div class="controls">
  <button class="control-btn" onclick="prevSlide()">‹</button>
  <button class="control-btn primary" onclick="toggleFullscreen()">Full Screen</button>
  <button class="control-btn primary" onclick="printCurrentLesson()">Print Lesson</button>
  <button class="control-btn primary" onclick="playCurrentSlide(false)">Play</button>
  <button class="control-btn primary" onclick="playCurrentSlide(true)">Slow</button>
  <button class="control-btn" onclick="nextSlide()">›</button>
</div>
<div class="status" id="status"></div>
<div class="hint">Use arrows · Space · Esc stops audio</div>
<audio id="ambientAudio" loop preload="none"></audio>

on": "Rachel needs help understanding what the class is doing.", "chunks": ["Can you repeat that?", "One more time, please.", "I’m not sure.", "Are we on page five?", "Slowly, please.", "Okay, got it."], "dialogue": [["Rachel", "Are we on page five?"], ["Jake", "I think so."], ["Rachel", "Can you repeat that?"], ["Teacher", "Page five. Exercise two."], ["Rachel", "Okay, got it."]], "lens": {"why": "Why do they say “Can you repeat that?”", "explanation": "Can questions are used to ask for help politely. They are survival tools when you do not understand everything.", "pattern": ["Can + you + action?", "Can you repeat that?", "Can you help me?", "Can you say that slowly?"], "examples": ["Can you repeat that?", "Can you help me?", "One more time, please.", "Slowly, please."], "practice": ["Can you repeat that?", "Can you help me?", "Can you show me?", "Can you say that slowly?"]}, "variation": "Now imagine someone speaks too fast at work.", "personal": "How do you feel when someone speaks too quickly?", "mission": "Ask for help politely after missing part of the class."}, {"num": 4, "title": "Identity Basics", "grammar": "Identity Structures", "emotion": "I can connect socially.", "canDo": "Say where you are from and respond to simple identity questions.", "environment": "After class conversation", "image": "assets/images/lesson04_after_class_talk.jpg", "audio": "assets/audio/lesson04_afterclass_ambience.mp3", "scene": "Rachel and Jake begin their first real conversation after class.", "exposure": "The classroom is quieter now. Students are leaving. Jake asks Rachel a personal but friendly question.", "situation": "Rachel wants to answer naturally without saying too much.", "chunks": ["I’m from Brazil.", "What about you?", "I speak a little English.", "I’m from here, actually.", "That’s cool.", "Not that long."], "dialogue": [["Jake", "Are you from around here?"], ["Rachel", "No, I’m from Brazil."], ["Jake", "That’s cool."], ["Rachel", "What about you?"], ["Jake", "I’m const SLIDE_COUNT = 12;
let currentLesson = 0;
let currentSlide = 0;
let selectedMaleVoice = null;
let selectedFemaleVoice = null;
let selectedNeutralVoice = null;
let ambientOn = false;

const deck = document.getElementById('deck');
const lessonSelect = document.getElementById('lessonSelect');
const statusEl = document.getElementById('status');
const ambientAudio = document.getElementById('ambientAudio');

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function enc(v){ return encodeURIComponent(String(v ?? '')); }

function slidesFor(lesson){
  return [
    {type:'hero', k:'Slide 01 · Emotional Arrival', title:lesson.title, text:lesson.scene},
    {type:'mission', k:'Slide 02 · Mission', title:'Today’s Survival Mission', text:lesson.emotion, mission:lesson.canDo},
    {type:'warmup', k:'Slide 03 · Cinematic Exposure', title:'Feel The Scene', text:lesson.exposure},
    {type:'chunks', k:'Slide 04 · Core Chunks', title:'Survival Language', items:lesson.chunks},
    {type:'key', k:'Slide 05 · Key Language', title:'What You Need To Notice', items:lesson.chunks.slice(0,4)},
    {type:'dialogue', k:'Slide 06 · Scene Talk', title:'Scene Talk', dialogue:lesson.dialogue},
    {type:'drill', k:'Slide 07 · Controlled Speaking', title:'Repeat. Then Adapt.', items:lesson.chunks.slice(0,4)},
    {type:'grammar', k:'Slide 08 · Language Lens v2', title:lesson.grammar, lens:lesson.lens},
    {type:'culture', k:'Slide 09 · Listening Recognition', title:'Listening Survival', text:'You do not need to understand every word. Recognize familiar chunks, emotion, and the situation.'},
    {type:'roleplay', k:'Slide 10 · Adaptive Variation', title:'New Situation', text:lesson.variation, items:lesson.chunks.slice(0,3)},
    {type:'complete', k:'Slide 11 · Personal Connection', title:'Connect To Your Life', text:lesson.personal, items:lesson.lens.practice},
    {type:'final', k:'Slide 12 · Voice Mission', title:'Voice Mission', mission:lesson.mission}
  ];
}

function slideFrame(slide, body){
  const lesson = LESSONS[currentLesson];
  const progress = ((currentSlide + 1) / SLIDE_COUNT) * 100;
  return `<section class="slide active" data-title="${esc(slide.title)}">
    <div class="american-line"></div>
    <div class="slide-bg"><img src="${esc(lesson.image)}" alt="${esc(lesson.environment)}"></div>
    <div class="slide-top">
      <div class="brand-lockup"><div class="wordmark">RFL</div><div class="brand-meta">Student Book<br>Module 01 · First Contact</div></div>
      <div class="slide-counter">${String(currentSlide+1).padStart(2,'0')} / 12</div>
    </div>
    <div class="slide-main">${body}</div>
    <div class="slide-footer"><span>${esc(lesson.title)} · ${esc(slide.k)}</span><div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div></div>
  </section>`;
}

function playBtn(text, speaker='Narrator') {
  return `<button class="play" onclick="speakText('${enc(text)}','${esc(speaker)}')">▶</button>`;
}

function renderSlide(slide){
  if(slide.type === 'hero'){
    return slideFrame(slide, `<div class="kicker">${esc(slide.k)}</div><h1>${esc(slide.title)}</h1><p class="subtitle">${esc(slide.text)}</p><button class="big-play" onclick="speakText('${enc(slide.text)}','Narrator')">▶ Play Scene</button>`);
  }
  if(slide.type === 'mission'){
    return slideFrame(slide, `<div class="two-col"><div><div class="kicker">${esc(slide.k)}</div><h2>${esc(slide.title)}</h2><p class="subtitle">${esc(slide.text)}</p></div><div class="mission-card"><small>Communication Goal</small><strong>${esc(slide.mission)}</strong><p>Use simple English to survive the moment, not to speak perfectly.</p></div></div>`);
  }
  if(slide.type === 'warmup'){
    return slideFrame(slide, `<div class="kicker">${esc(slide.k)}</div><h2>${esc(slide.title)}</h2><div class="prompt-card"><div class="label">Scene Context</div><div class="prompt">${esc(slide.text)}</div></div><button class="big-play" onclick="speakText('${enc(slide.text)}','Narrator')">▶ Play Context</button>`);
  }
  if(slide.type === 'chunks'){
    const cards = slide.items.map((item,i)=>`<div class="vocab-card"><strong>${esc(item)}</strong><span>Survival chunk</span><em>Use it in the scene.</em>${playBtn(item)}</div>`).join('');
    return slideFrame(slide, `<div class="kicker">${esc(slide.k)}</div><h2>${esc(slide.title)}</h2><div class="vocab-grid">${cards}</div>`);
  }
  if(slide.type === 'key'){
    const rows = slide.items.map((item,i)=>`<div class="mission-item">${esc(item)}${playBtn(item)}</div>`).join('');
    return slideFrame(slide, `<div class="kicker">${esc(slide.k)}</div><h2>${esc(slide.title)}</h2><div class="mission-list">${rows}</div>`);
  }
  if(slide.type === 'dialogue'){
    const lines = slide.dialogue.map(row=>{
      const speaker = row[0], text = row[1];
      const cls = speaker.toLowerCase()==='rachel' ? 'rachel' : (speaker.toLowerCase()==='staff'||speaker.toLowerCase()==='teacher'||speaker.toLowerCase()==='worker' ? 'staff' : '');
      const initial = esc(speaker.charAt(0).toUpperCase());
      return `<div class="dialogue-line" data-speaker="${esc(speaker)}"><div class="avatar ${cls}">${initial}</div><div class="speaker ${cls==='rachel'?'rachel':''}">${esc(speaker)}</div><div class="dialogue-text">${esc(text)}</div><button class="play" onclick="playSingleLine(this)">▶</button></div>`;
    }).join('');
    return slideFrame(slide, `<div class="kicker">${esc(slide.k)}</div><h2>${esc(slide.title)}</h2><div class="dialogue-box" id="dialogueMain">${lines}</div><button class="big-play" onclick="playDialogue()">▶ Play Dialogue</button>`);
  }
  if(slide.type === 'drill'){
    const items = slide.items.map(item=>`<div class="mission-item">${esc(item)}${playBtn(item)}</div>`).join('');
    return slideFrame(slide, `<div class="kicker">${esc(slide.k)}</div><h2>${esc(slide.title)}</h2><div class="mission-list">${items}</div><p class="subtitle">First repeat safely. Then change one word or one situation.</p>`);
  }
  if(slide.type === 'grammar'){
    const lens = slide.lens;
    const examples = [
      `<div class="example"><strong>Why:</strong> ${esc(lens.why)}</div>`,
      `<div class="example"><strong>Pattern:</strong> ${esc(lens.pattern.join(' · '))}</div>`,
      ...lens.examples.map(ex=>`<div class="example">${esc(ex)}</div>`),
      `<div class="example"><strong>Practice:</strong> ${esc(lens.practice.join(' · '))}</div>`
    ].join('');
    return slideFrame(slide, `<div class="grammar-focus"><div class="grammar-panel"><small>Language Lens v2</small><strong>${esc(slide.title)}</strong><p>${esc(lens.explanation)}</p></div><div class="examples">${examples}</div></div>`);
  }
  if(slide.type === 'culture'){
    return slideFrame(slide, `<div class="culture"><div><div class="kicker">${esc(slide.k)}</div><h2>${esc(slide.title)}</h2><p class="subtitle">${esc(slide.text)}</p></div><div class="culture-note"><strong>Listening Safety</strong><p>Listen for emotional intention, not word-by-word translation. Partial understanding is success.</p></div></div>`);
  }
  if(slide.type === 'roleplay'){
    const chips = slide.items.map(item=>`<span class="chip">${esc(item)}</span>`).join('');
    return slideFrame(slide, `<div class="kicker">${esc(slide.k)}</div><h2>${esc(slide.title)}</h2><div class="prompt-card"><div class="label">Adaptive Transfer</div><div class="prompt">${esc(slide.text)}</div></div><div class="word-bank">${chips}</div>`);
  }
  if(slide.type === 'complete'){
    const items = slide.items.map(item=>`<div class="mission-item">${esc(item)}${playBtn(item)}</div>`).join('');
    return slideFrame(slide, `<div class="two-col"><div><div class="kicker">${esc(slide.k)}</div><h2>${esc(slide.title)}</h2><p class="subtitle">${esc(slide.text)}</p></div><div class="mission-list">${items}</div></div>`);
  }
  if(slide.type === 'final'){
    return slideFrame(slide, `<div class="two-col"><div><div class="kicker">${esc(slide.k)}</div><h2>${esc(slide.title)}</h2><p class="subtitle">Record your answer. Keep it simple. Communication first.</p></div><div class="mission-card"><small>Voice Mission</small><strong>${esc(slide.mission)}</strong><p>This is your personal output for the lesson.</p></div></div>`);
  }
}

function render(){
  const lesson = LESSONS[currentLesson];
  const slide = slidesFor(lesson)[currentSlide];
  deck.innerHTML = renderSlide(slide);
  lessonSelect.value = String(currentLesson);
  statusEl.textContent = `Lesson ${currentLesson+1} / ${LESSONS.length} · Slide ${currentSlide+1} / 12 · ${lesson.title}`;
  setAmbientSource();
}

function setup(){
  LESSONS.forEach((lesson, idx)=>{
    const opt = document.createElement('option');
    opt.value = String(idx);
    opt.textContent = `${String(lesson.num).padStart(2,'0')} · M1 · ${lesson.title} · A0`;
    lessonSelect.appendChild(opt);
  });
  lessonSelect.addEventListener('change', e=>{ stopAudio(); currentLesson = Number(e.target.value); currentSlide = 0; render(); });
}

function nextSlide(){ stopSpeech(); if(currentSlide < 11) currentSlide++; else if(currentLesson < LESSONS.length-1){ currentLesson++; currentSlide=0; } render(); }
function prevSlide(){ stopSpeech(); if(currentSlide > 0) currentSlide--; else if(currentLesson > 0){ currentLesson--; currentSlide=11; } render(); }

function setAmbientSource(){
  const src = LESSONS[currentLesson].audio;
  if(!ambientAudio.src.endsWith(src)) {
    ambientAudio.src = src;
    ambientAudio.volume = 0.18;
    if(ambientOn) ambientAudio.play().catch(()=>{ statusEl.textContent += ' · Ambient blocked until user interaction'; });
  }
}
function toggleAmbient(){
  ambientOn = !ambientOn;
  setAmbientSource();
  if(ambientOn) ambientAudio.play().catch(()=>{ statusEl.textContent += ' · Ambient blocked by browser'; });
  else ambientAudio.pause();
}

function getVoices(){ return ('speechSynthesis' in window) ? window.speechSynthesis.getVoices() : []; }
function pickVoices(){
  const voices = getVoices();
  const en = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  const find = names => en.find(v => names.some(n => v.name.toLowerCase().includes(n.toLowerCase())));
  selectedFemaleVoice = find(['Samantha','Jenny','Aria','Zira','Victoria','Karen','Moira','Tessa','Ava','Susan']) || en[0] || voices[0] || null;
  selectedMaleVoice = find(['Daniel','Guy','David','Alex','Fred','Tom','Ryan','Aaron','Arthur','George']) || en[1] || en[0] || voices[0] || null;
  selectedNeutralVoice = en[0] || voices[0] || null;
}
function voiceFor(speaker){
  const s = String(speaker||'').toLowerCase();
  if(s === 'rachel') return selectedFemaleVoice;
  if(s === 'jake' || s === 'staff' || s === 'worker' || s === 'teacher') return selectedMaleVoice;
  return selectedNeutralVoice;
}
function speakText(encodedText, speaker='Narrator', slow=false){
  if(!('speechSynthesis' in window)){ statusEl.textContent = 'TTS not supported in this browser.'; return Promise.resolve(); }
  return new Promise(resolve=>{
    const text = decodeURIComponent(encodedText || '');
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = slow ? 0.72 : 0.88;
    u.pitch = String(speaker).toLowerCase()==='rachel' ? 1.08 : 0.96;
    if(!selectedMaleVoice && !selectedFemaleVoice) pickVoices();
    const voice = voiceFor(speaker);
    if(voice) u.voice = voice;
    u.onend = resolve; u.onerror = resolve;
    window.speechSynthesis.speak(u);
  });
}
function playSingleLine(btn){
  stopSpeech();
  const line = btn.closest('.dialogue-line');
  const speaker = line.dataset.speaker || 'Jake';
  const text = line.querySelector('.dialogue-text').innerText || '';
  line.classList.add('active');
  speakText(encodeURIComponent(text), speaker).then(()=>line.classList.remove('active'));
}
async function playDialogue(){
  stopSpeech();
  const lines = [...document.querySelectorAll('#dialogueMain .dialogue-line')];
  for(const line of lines){
    const speaker = line.dataset.speaker || 'Jake';
    const text = line.querySelector('.dialogue-text').innerText || '';
    line.classList.add('active');
    await speakText(encodeURIComponent(text), speaker);
    line.classList.remove('active');
    await new Promise(r=>setTimeout(r,250));
  }
}
function playCurrentSlide(slow=false){
  const lesson = LESSONS[currentLesson];
  const slide = slidesFor(lesson)[currentSlide];
  let text = [slide.title, slide.text, slide.mission].filter(Boolean).join('. ');
  if(slide.items) text += '. ' + slide.items.join('. ');
  if(slide.dialogue) text += '. ' + slide.dialogue.map(r=>r[1]).join('. ');
  if(slide.lens) text += '. ' + [slide.lens.why, slide.lens.explanation, ...slide.lens.pattern, ...slide.lens.examples, ...slide.lens.practice].join('. ');
  speakText(encodeURIComponent(text), 'Narrator', slow);
}
function stopSpeech(){ if('speechSynthesis' in window) window.speechSynthesis.cancel(); document.querySelectorAll('.dialogue-line.active').forEach(l=>l.classList.remove('active')); }
function stopAudio(){ stopSpeech(); ambientAudio.pause(); }
function toggleFullscreen(){
  const target = document.getElementById('deck');
  try{
    if(!document.fullscreenElement && target.requestFullscreen) target.requestFullscreen();
    else if(document.exitFullscreen) document.exitFullscreen();
  }catch(e){ statusEl.textContent = 'Fullscreen blocked by browser or sandbox.'; }
}

function printCurrentLesson(){
  stopAudio();
  const savedSlide = currentSlide;
  const lesson = LESSONS[currentLesson];
  const oldTitle = document.title;
  document.title = `RFL Module 01 - Lesson ${String(lesson.num).padStart(2,'0')} - ${lesson.title}`;
  const printSlides = slidesFor(lesson).map((slide, index) => {
    currentSlide = index;
    return renderSlide(slide);
  }).join('');
  deck.innerHTML = printSlides;
  document.body.classList.add('print-current-lesson');

  const restore = () => {
    window.removeEventListener('afterprint', restore);
    document.body.classList.remove('print-current-lesson');
    document.title = oldTitle;
    currentSlide = savedSlide;
    render();
  };

  window.addEventListener('afterprint', restore);
  window.print();

  // Fallback for browsers that do not reliably fire afterprint.
  setTimeout(() => {
    if(document.body.classList.contains('print-current-lesson')) restore();
  }, 1500);
}

function downloadHTML(){
  const blob = new Blob(['<!DOCTYPE html>\n' + document.documentElement.outerHTML], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'RFL_Module01_Master_Template_Print_Full_Landscape.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
}
function runTests(){
  console.assert(LESSONS.length === 12, 'Expected 12 lessons');
  console.assert(LESSONS.every(l => slidesFor(l).length === 12), 'Each lesson must have 12 slides');
  console.assert(document.querySelectorAll('#lessonSelect option').length === 12, 'Dropdown must show 12 lessons');
}
document.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') nextSlide();
  if(e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
  if(e.key === 'Escape') stopAudio();
});
if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged = pickVoices; pickVoices(); }
setup(); render(); runTests();
</script>
</body>
